<!doctype html>
<html lang="de" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<title>Klaus Orb</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="klaus.js"></script>
<style>
  @font-face { font-family: "Rajdhani"; font-weight: 700; src: url(vendor/rajdhani-700.woff2) format("woff2"); }
  :root { --rgb: 0, 229, 255; --cyan: #00e5ff; --text: #ffffff; --ease: cubic-bezier(.165, .84, .44, 1); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; font-family: "Rajdhani", "Segoe UI", sans-serif;
    opacity: 0; transform: scale(.94); transition: opacity .35s var(--ease), transform .35s var(--ease); }
  body.an { opacity: 1; transform: none; }
  body.aus { transition-duration: .18s; }  /* Ausgang schneller als Eingang */
  canvas { width: 100%; flex: 1; min-height: 0; }
  .titel { font-weight: 700; font-size: 14px; letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 12px rgba(var(--rgb), .7); }
  .text { min-height: 70px; max-width: 92%; margin: 6px 0 18px; text-align: center; color: var(--text); font-weight: 700; font-size: 22px;
    line-height: 1.3; text-shadow: 0 2px 10px #000, 0 0 2px #000; text-wrap: balance; }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div class="titel" id="titel">KLAUS</div>
<div class="text" id="text"></div>
<script>
const TITEL = { start: "KLAUS", hoeren: "KLAUS · HÖRT ZU", denken: "KLAUS · DENKT", sprechen: "KLAUS",
                aktion: "KLAUS · LOS GEHT'S", fehler: "KLAUS · PROBLEM" };
const orb = new KlausOrb(document.getElementById("orb"));
klausBereit.then((klaus) => {
  klaus.ladeThema(wendeThemaAn);
  klaus.thema.connect(wendeThemaAn);
  klaus.zustand.connect((z) => {
    orb.setZustand(z);
    document.body.classList.toggle("an", z !== "aus");
    document.body.classList.toggle("aus", z === "aus");
    if (TITEL[z]) document.getElementById("titel").textContent = TITEL[z];
  });
  klaus.pegel.connect((p) => orb.setPegel(p));
  klaus.untertitel.connect((t) => { document.getElementById("text").textContent = t; });
});
</script>
</body>
</html>
